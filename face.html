<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - log in or sign up</title>
    <link rel="shortcut icon" href="logo1.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *{
             background-color: rgb(241, 241, 241);
            padding:0%;
            margin: 0;
          
               
        }
        
        .left{
             
           position: relative;
           left: 16.5rem;
           top: 1rem;
           width: 35rem;
          
           
           

        }
        .logo{
            height: 16rem;
            width:18rem;
            position: relative;
            top: 5.7rem;
            right: .8rem;
       
           
            
        }
        .text{
           position: absolute;
        font-family: "Roboto", sans-serif;
        font-size: 1.75rem;
        font-weight: 350;      
        }
        .box{
            background-color: white;
            width:25rem;
            height: 22rem;
            margin-left: 53rem;
            position: relative;
            bottom: 8rem;
           box-shadow: .1rem .1rem .5rem rgb(185, 181, 181);
            
        }
        .form{
            background-color: white;

        }
        .input{
            height: 3rem;
            width: 90%;
            font-size: 1.1rem;
            margin-top: 4%;
            margin-left: 5%;
            border-radius:.3rem;
            opacity: .6;
            border-color:rgb(214, 214, 214) ;
            box-sizing: border-box;
            padding-left:3%;
            padding-right: 3%;
            background: #ffff;
        }
        .login{
            height: 3rem;
            width: 90%;
            font-size: 1.4rem;
            margin-top: 5%;
            margin-left: 5%;
            box-sizing: border-box;
            padding-left:3%;
            padding-right: 3%;
            border-radius:.3rem;
            background-color: #1c5094;
            color: white;
             
        }
        .forget{
            
            margin-left: 33%;
            position: relative;
            top: 1rem;
            background-color: white;
            color:#1c5094 ;
            text-decoration: none;
            font-family: Helvetica, Arial, sans-serif;
        }
        .boxfooter{
            width: 90%;
            height: 30%;
            border-top: 1px solid rgb(185, 181, 181);
            margin-left: 5%;
            background-color: white;
            margin-top: 1.95rem;
        }
        .newaccount{
            width: 60%;
            height: 3rem;
            margin-left: 20%;
            position: relative;
            top: 27.5%;
            border-radius:.3rem;
            background-color: #42b72a;
            color: white;
            font-family: Helvetica, Arial, sans-serif;
            font-size: 1.1rem;
        }
        .last{
            margin-left: 55rem;
            position: relative;
            bottom: 6.5rem;
        }
    </style>
</head>
<body>
    
     <div class="left">
        <img src="facebook1.png" alt="" class="logo">
        <div class="text">Facebook helps you connect and share <br>
             with the people in your life.</div> 
     </div>
     <div class="box">
        <form class="form">
        <input type="text" placeholder="Email address or phone number" class="input" required><br>
        <input type="password" placeholder="Password" class="input" required>
        <button class="login">Log in</button>
        </form>
        <a href="" class="forget">Forgotten password?</a>
        <div class="boxfooter">
           
            <a href="https://www.facebook.com/r.php?entry_point=login" style="background-color:white; "><button class="newaccount">Create a new account</button></a>
        </div>
     </div>
            
      <div class="last" style="font-family: Helvetica, Arial, sans-serif; "><b>Create a page </b>for a celebrity, brand or business</div>
     
    
</body>
</html>
